[build]
command = "npm run build"
publish = "dist"

[[redirects]]
from = "/cv_ezequiel.pdf"
to = "/cv-es.pdf"
status = 301
force = true

[[headers]]
for = "/*"

  [headers.values]
  X-Content-Type-Options = "nosniff"
  X-Frame-Options = "DENY"
  Referrer-Policy = "strict-origin-when-cross-origin"
  Permissions-Policy = "camera=(), microphone=(), geolocation=()"
